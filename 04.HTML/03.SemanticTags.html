<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic tags</title>
</head>

<body>
    <!-- semantic tags -->

    <!-- Header tag -->
    <header>
        <h1>My HTML</h1>
    </header>

    <hr>

    <!-- Main tag -->
    <main>
        <!-- Tags inside main tag -->

        <!-- Section tag -->
        <section>education : B.sc. I.T. | Maharastra college</section>
        <section>experiences : None</section>

        <!-- Article tag -->
        <article>My story : jiska koi ni hota , uska koi ni hota</article>

        <hr>

        <!-- Aside tag -->
        <aside>This is an Ad</aside>

        <hr>

        <!-- Anchor tag | to open links on new page -->
        <a href="https://www.google.com/" target="_main">Google</a>

        <br />

        <!-- Anchor tag | images to redirect -->
        <a href="https://www.google.com/" target="_main">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/035/746/056/small/google-app-logo-in-big-sur-style-3d-render-icon-design-concept-element-isolated-transparent-background-free-png.png"
                alt="Google Logo" height="120" />
        </a>

        <hr>

        <!-- Div tag | Takes whole width | useful in css maybe | Non-Semantic -->
        <div>
            <p>hello</p>
        </div>

        <!-- Span tag | Takes width according to elements | Non-Semantic -->
        <span> Bye</span>

    </main>

    <!-- Footer tag -->
    <footer>
        <h5>Contact me at real@gmail.com</h5>
    </footer>



</body>

</html>
