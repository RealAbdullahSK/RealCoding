<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <main>

        <!-- Unordered List -->
        <ul>
            <li>Apple</li>
            <!-- Sub-List -->
            <ul>
                <li>Season : Winter</li>
                <li>Colour : Red</li>
            </ul>
            <li>Mango</li>
            <ul>
                <li>Season : Summer</li>
                <li>Colour : Yellow</li>
            </ul>
            <li>Litchi</li>
        </ul>

        <hr>

        <!-- ordered List -->
        <ol>
            <li>Apple</li>
            <!-- Sub-List -->
            <ul>
                <li>Season : Winter</li>
                <li>Colour : Red</li>
            </ul>
            <li>Mango</li>
            <ul>
                <li>Season : Summer</li>
                <li>Colour : Yellow</li>
            </ul>
            <li>Litchi</li>
        </ol>

        <hr>

        <!-- Table tag -->
        <table>
            <!-- table head tag | No visible changes -->
            <thead>
                <!-- Caption tag -->
                <Caption>Student data</Caption>
                <!-- table row tag -->
                <tr>
                    <!-- streches the text to column size -->
                    <th colspan="2">INFORMATION</th>
                </tr>
                <tr>
                    <!-- table header/column tag -->
                    <th>Name</th>
                    <th>Roll no</th>
                </tr>
            </thead>


            <!-- table body tag | No visible changes -->
            <tbody>
                <tr>
                    <!-- table data tag -->
                    <td>RealAbdullah</td>
                    <td>143</td>
                </tr>
            </tbody>
        </table>

    </main>

</body>

</html>
